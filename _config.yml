title: "Psax's Skeptiffic Globuli"
author: "Pavel Šmejkal (Psax)"
description: "Potent globuli of critical thinking, scientific facts, field notes from Central Bohemia, and skeptical dispatches."
theme: minima

baseurl: "/PSG"
url: "https://pan-psax.github.io"

header_pages:
  - dispatches.md
  - field-notes.md
  - about.md

# Definice vlastních oddělených sekcí
collections:
  field_notes:
    output: true
    permalink: /field-notes/:title/
  dispatches:
    output: true
    permalink: /dispatches/:title/

defaults:
  - scope:
      path: ""
      type: "dispatches"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "field_notes"
    values:
      layout: "post"
